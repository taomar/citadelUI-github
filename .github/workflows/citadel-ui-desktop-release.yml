name: Citadel UI desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - citadel-ui-desktop-v*

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
          - runner: macos-26-intel
            platform: darwin
            arch: x64
          - runner: macos-26
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: CitadelUI/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CitadelUI/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const version=require('./package.json').version; const expected='citadel-ui-desktop-v'+version; if(process.env.RELEASE_TAG!==expected){throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)}"
      - run: npm test
      - name: Configure macOS signing
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/citadel-developer-id.p12
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Building unsigned macOS packages."
            exit 0
          fi
          certificate_path="${RUNNER_TEMP}/citadel-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/citadel-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          python3 -c 'import base64,os; open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(os.environ["MACOS_CERTIFICATE"]))'
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          echo "CITADEL_MACOS_SIGN=true" >> "${GITHUB_ENV}"
      - name: Build package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Smoke test packaged application
        run: node run-packaged-smoke.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: CitadelUI/desktop/.generated/source-step-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Stage release assets
        run: node stage-release.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --checksum-name=SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
      - name: Verify installed Windows upgrade
        if: matrix.platform == 'win32'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: node test-windows-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: citadel-ui-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: CitadelUI/desktop/out/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: citadel-ui-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name 'SHA256SUMS-*' -delete
          cd release-assets
          sha256sum \
            CitadelUISetup.exe \
            CitadelUIPortable.zip \
            CitadelUI-macOS-arm64.dmg \
            CitadelUI-macOS-arm64.zip \
            CitadelUI-macOS-x64.dmg \
            CitadelUI-macOS-x64.zip \
            CitadelUI-build-win32-x64.json \
            CitadelUI-build-darwin-arm64.json \
            CitadelUI-build-darwin-x64.json \
            RELEASES \
            citadel_ui-*.nupkg |
            awk '{ print toupper($1) "  " $2 }' > SHA256SUMS.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#citadel-ui-desktop-v}"
          source_revision="$(jq -r '.applicationRevision' release-assets/CitadelUI-build-win32-x64.json)"
          for identity in release-assets/CitadelUI-build-*.json; do
            jq -e --arg revision "$source_revision" --arg version "$version" \
              '.applicationRevision == $revision and .version == $version and .dirty == false' "$identity" > /dev/null
          done
          cat > release-notes.md <<EOF
          Citadel UI Desktop ${version} packages the existing Citadel Control Plane for Windows x64, macOS Apple Silicon, and macOS Intel.

          Application source: [\`${source_revision}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${source_revision}). This includes the current Bicep/native Terraform UI, modularized application, local-source creation, Diagnostics, and the Electron local-folder fixes. Versions through 1.1.3 packaged an older application baseline.

          Every native package verifies the complete server/shared/web source inventory and hashes. The packaged UI test signs into an isolated instance, opens Add workspace, checks both formats and all four source choices, initializes the vendored native parser, and opens Diagnostics. Local-folder permission and persistent-workspace save checks run separately; native folder pickers are not automated.

          ## Assets

          - \`CitadelUISetup.exe\` - Windows per-user installer
          - \`CitadelUIPortable.zip\` - Windows portable package
          - \`CitadelUI-macOS-arm64.dmg\` and \`.zip\` - Apple Silicon
          - \`CitadelUI-macOS-x64.dmg\` and \`.zip\` - Intel Macs
          - \`SHA256SUMS.txt\` - checksums for every package
          - \`CitadelUI-build-*.json\` - application/release revisions and bundled runtime hashes for each platform
          - \`RELEASES\` and \`citadel_ui-*.nupkg\` - the installed Windows application's in-place update feed

          Quit any older Citadel UI instance before opening this release. Replace the complete portable folder or macOS application, not only the executable. The window title and lower-left label display the desktop version and application source revision.

          The button beneath the version checks for updates. macOS and portable Windows copies notify only. Supported installed Windows builds can download and prepare an update after confirmation, then restart after a separate confirmation. Automatic checks never download or restart the app. Install this updater-enabled release once before using future in-app Windows updates.

          Unless signing secrets were configured for this workflow, these packages are unsigned and the macOS packages are not notarized. Verify the checksum before opening a package. Production macOS distribution requires an Apple Developer ID certificate and notarization.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Citadel UI Desktop ${version}" \
            --notes-file release-notes.md
