# Optional: encrypted credential persistence.
#
# This file is deliberately separate from `compose.yaml`. The default deployment
# has no key and therefore no vault, which is the safe default: connections live
# in server memory and a restart asks for a token again. Adding a key is an
# explicit act, and it should look like one.
#
# `CITADEL_CREDENTIAL_KEY_PATH` is a path on the host to a file containing a
# random 256-bit key — raw 32 bytes, or its hex or base64 text. Generate it
# OUTSIDE this repository and OUTSIDE the Citadel data directory, so a stolen
# data volume and the key that opens it are not lost to the same accident:
#
#   PowerShell:
#     $b = New-Object byte[] 32
#     [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
#     [System.IO.File]::WriteAllBytes('C:\path\outside\repo\credential.key', $b)
#
#   POSIX:
#     umask 077 && openssl rand -out /path/outside/repo/credential.key 32
#
# Then restrict it to your own account and run:
#
#   docker compose -f compose.yaml -f compose.credentials.yaml up --detach --build
#
# The key is mounted read-only. `CITADEL_CREDENTIAL_KEY_FILE` carries the mount
# PATH, never the key itself: an environment value is visible in `docker inspect`,
# in a process listing, and in a crash report, and would put the master key in
# all three.
services:
  app:
    environment:
      CITADEL_CREDENTIAL_KEY_FILE: /run/secrets/citadel-credential-key
    volumes:
      - type: bind
        source: ${CITADEL_CREDENTIAL_KEY_PATH:?set CITADEL_CREDENTIAL_KEY_PATH to the host key file}
        target: /run/secrets/citadel-credential-key
        read_only: true
