# Citadel UI — the azd project for the *application*.
#
# This file deliberately lives here, in `CitadelUI/`, and not at the repository
# root. The root already has an `azure.yaml`, and it belongs to something else:
# it declares `ai-citadel-governance-hub` with `infra: bicep/infra`, which is the
# Citadel APIM platform. That platform is not this application's infrastructure —
# it is this application's *data*. `shared/source-plan.mjs` names
# `bicep/infra/main.bicepparam` as MAIN_PATH, the exact file the Main editor
# opens.
#
# So running `azd up` at the root would deploy the wrong product entirely, and
# generating infrastructure there would overwrite the very files this editor
# exists to edit. Everything for this deployment stays inside `CitadelUI/`.
name: citadel-ui
metadata:
  template: citadel-ui@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  # The hooks first validate deployment inputs and read existing resources,
  # without changing them. Only then may the UI resource group be created or
  # tagged. No tags are written to separately selected existing-resource groups.
  #
  # This tenant enforces `allowSharedKeyAccess = false` on storage accounts, and
  # enforces it silently: the request to set it true is accepted and the value
  # stays false. Container Apps mounts Azure Files over SMB with the account key,
  # so the mount is refused with `mount error(13)` and the container exits 1 at
  # startup -- /data is required to boot, not only to persist. Tagging the group
  # `SecurityControl: Ignore` exempts it, and the tag must be there before the
  # storage account is evaluated, so it cannot be applied afterwards by hand.
  preprovision:
    shell: pwsh
    run: ./scripts/prepare-deployment.ps1
    continueOnError: false
    interactive: false
  # Initialize the key before the first UI image starts, including during azd up.
  postprovision:
    shell: pwsh
    run: ./scripts/ensure-credential-key.ps1
    continueOnError: false
    interactive: false

services:
  citadelui:
    project: .
    # `docker`, not `js`: this application has no package.json, no lockfile and
    # no node_modules, and its Dockerfile removes npm from the runtime image.
    # There is nothing here for a Node build pack to do, and inviting one would
    # undo a deliberate supply-chain position.
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Build in ACR rather than locally.
      #
      # Two independent local failures make a local build-and-push unreliable
      # here, and neither is a property of this application. Docker Desktop's
      # proxy drops the large base layer partway through the push, and azd's own
      # registry login fails the token exchange with a 401 even though the
      # signed-in user holds AcrPush and `az acr login` succeeds with the same
      # identity. A remote build sidesteps both: azd uploads the build context
      # and ACR Tasks builds and stores the image, so nothing is pushed over the
      # local network and no registry credential is needed on this machine.
      #
      # It is also nearly free here. The context is ~2 MB, because this app has
      # no dependencies and no node_modules to upload.
      remoteBuild: true
