<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citadel Control Panel</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/terraform-export.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div class="shell" data-rail="off">
      <header class="titleblock">
        <a class="tb-brand" href="/" aria-label="Citadel Control Panel">
          <span class="tb-mark" aria-hidden="true"></span>
          <span class="tb-brand-copy">
            <span class="tb-name">Citadel</span>
            <span class="tb-mode">Control Panel</span>
          </span>
        </a>

        <button id="workspace-switch" class="workspace-switch" type="button">
          <span class="workspace-switch-label">Workspace</span>
          <span class="workspace-switch-context">
            <span id="project-name" class="tb-crumb tb-project">Project</span>
            <span class="tb-chevron" aria-hidden="true">&#8250;</span>
            <span id="environment-name" class="tb-crumb tb-environment">Environment</span>
          </span>
          <span class="menu-chevron" aria-hidden="true"></span>
        </button>
        <nav class="global-actions" aria-label="Application">
          <a class="btn btn-ghost" href="/debug.html" target="_blank" rel="noreferrer noopener" aria-label="Diagnostics (opens in a new tab)">Diagnostics</a>
          <button id="global-settings" class="btn btn-ghost" type="button" disabled>Settings</button>
        </nav>
      </header>

      <section class="commandbar" aria-label="Document commands">
        <div class="tb-context">
          <div class="tb-doc">
            <strong id="document-label">Choose a document</strong>
            <code id="repo-path" class="tb-path">&#8230;</code>
          </div>
          <div class="source-context" aria-label="Source and write target">
            <span id="configuration-format" class="format-badge" hidden></span>
            <span id="source-kind" class="source-kind">Local</span>
            <button id="local-path-copy" class="tb-local" type="button">
              <span id="local-path-label" class="tb-local-label" aria-hidden="true">Repository</span>
              <code id="local-path">Path not recorded</code>
              <span class="tb-copy-mark" aria-hidden="true">Copy</span>
            </button>
            <span id="write-target" class="write-target"></span>
          </div>
        </div>
        <div id="tb-actions" class="tb-actions"></div>
      </section>

      <nav id="sidebar" class="rail rail-areas" aria-label="Workspace explorer"></nav>

      <aside class="rail rail-areas catalog-rail" aria-label="Workspace overview">
        <div class="area active">
          <span class="area-title">Workspaces</span>
          <span class="area-sub">Repositories and connections</span>
        </div>
      </aside>

      <aside id="context-rail" class="rail rail-context" aria-label="Section index"></aside>

      <main id="workspace" class="sheet" tabindex="-1"></main>
      <div id="editor-loading" class="editor-loading banner" role="status" hidden></div>

      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <dialog id="modal" class="modal" aria-modal="true"></dialog>
    </div>

    <script type="module" src="/js/app.mjs"></script>
  </body>
</html>
